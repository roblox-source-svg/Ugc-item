<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ghost Site</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: black;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      height: 100%;
      overflow: hidden;
    }
    #video-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: black;
      z-index: 9999;
    }
    #video-container video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <div id="video-container">
    <video id="scary-video" src="lv_0_20250627004717.mp4" autoplay muted playsinline></video>
  </div>

  <script>
    window.onload = async function() {
      const videoContainer = document.getElementById("video-container");
      const video = document.getElementById("scary-video");

      // Remove o mute após iniciar (para permitir som após interação mínima)
      setTimeout(() => {
        video.muted = false;
      }, 1000);

      // Tenta entrar em tela cheia
      try {
        if (videoContainer.requestFullscreen) {
          await videoContainer.requestFullscreen();
        } else if (videoContainer.webkitRequestFullscreen) {
          await videoContainer.webkitRequestFullscreen();
        }
      } catch (e) {
        console.log("Falha ao entrar em tela cheia:", e);
      }

      video.play();
    };
  </script>
</body>
</html>
